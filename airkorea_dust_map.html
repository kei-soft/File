<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;

.leaflet-grab {

	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {

	}
.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,

.leaflet-marker-icon,

.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

	}

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;

	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;

	}
.leaflet-bar a.leaflet-disabled {

	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {

	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;

	}
.leaflet-control-layers-toggle {

.leaflet-touch .leaflet-control-layers-toggle {

	}
.leaflet-control-layers .leaflet-control-layers-list,

/* Default icon URLs */

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;

	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;

	font-size: 13px;

	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;

	margin-top: -1px;
	margin-left: -20px;

	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

	}
.leaflet-container a.leaflet-popup-close-button {

.leaflet-container a.leaflet-popup-close-button:hover,
.leaflet-container a.leaflet-popup-close-button:focus {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {

	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

	color: #222;

	}
.leaflet-tooltip.leaflet-interactive {

	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}
.leaflet-tooltip-top:before {
	bottom: 0;
	margin-bottom: -12px;
	border-top-color: #fff;
	}
.leaflet-tooltip-bottom:before {
	top: 0;
	margin-top: -12px;

	}

	margin-left: -6px;
}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

	}

<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}
body{display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #ddd;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0 15px 0 0}
input,select,button{height:38px;border:1px solid #ccc;border-radius:7px;padding:0 10px;background:#fff}
input{width:min(430px,46vw)}
button{cursor:pointer;font-weight:700}
button.primary{background:#111827;color:#fff;border-color:#111827}
#status{padding:8px 16px;border-bottom:1px solid #ddd;font-size:13px;background:#fafafa;display:flex;gap:18px;flex-wrap:wrap}
#map{flex:1;min-height:420px}
.msg{position:fixed;z-index:9999;top:110px;left:50%;transform:translateX(-50%);max-width:850px;background:#111827;color:#fff;padding:10px 14px;border-radius:8px;display:none;font-size:13px}
.legend{background:#fff;opacity:1;padding:9px 11px;border-radius:8px;box-shadow:0 1px 8px #999;font-size:12px;line-height:1.65}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.num-label{background:transparent;border:0;box-shadow:none;font-weight:900;font-size:14px;line-height:1;padding:0;color:#111;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff}
pre{white-space:pre-wrap}
@media(max-width:700px){h1{width:100%}input{width:100%;flex:1}header{align-items:stretch}}

#topWrap{background:#fff}
#topWrap.collapsed header{display:none}
.mobile-actions{
  display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:#fff;border-bottom:1px solid #ddd;
}
.mobile-actions button{
  height:38px;border:1px solid #cfd3d8;border-radius:8px;background:#fff;
  padding:0 12px;font-weight:800;cursor:pointer
}
.mobile-actions .dark{background:#111827;color:#fff;border-color:#111827}
#mapOnlyBtn.active{background:#111827;color:#fff;border-color:#111827}
#locateBtn{margin-left:auto}
body.map-only #topWrap{display:none}
body.map-only #map{height:100vh}
.locate-control{
  background:#fff;border:2px solid rgba(0,0,0,.2);border-radius:4px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.18)
}
.locate-control:hover{background:#f3f4f6}
@media(min-width:701px){
  .mobile-actions{padding:6px 16px}
}


#restoreUiBtn{
  position:fixed;
  top:12px;
  right:12px;
  z-index:10000;
  height:42px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:10px;
  background:#111827;
  color:#fff;
  font-weight:900;
  box-shadow:0 2px 10px rgba(0,0,0,.28);
  display:none;
  cursor:pointer;
}
body.map-only #restoreUiBtn{display:block}



#sourceInfo{color:#6b7280}



</style>

<body>
<button id="restoreUiBtn" type="button">UI 보기</button>
<div id="topWrap">
<div class="mobile-actions">
  <button id="collapseBtn">▲ 상단 접기</button>
  <button id="mapOnlyBtn" class="dark">지도만 보기</button>
  <button id="locateBtn">◎ 현재위치</button>
</div>
<header>
  <h1>전국 미세먼지 측정소 지도</h1>
  <select id="pollutant">
    <option value="pm10">PM10 미세먼지</option>
    <option value="pm25">PM2.5 초미세먼지</option>
  </select>
  <label style="display:flex;align-items:center;gap:5px;font-weight:700">
    <input id="showValues" type="checkbox" checked style="width:auto;height:auto">
    값 표시
  </label>
  <label style="display:flex;align-items:center;gap:5px;font-weight:700">
    <input id="showHeatmap" type="checkbox" style="width:auto;height:auto">
    분포도 표시
  </label>
  <input id="minValue" type="number" inputmode="numeric" min="0" step="1" placeholder="최소 수치 이상만 표시" style="width:170px">
  <input id="key" type="password" value="" placeholder="공공데이터포털 일반 인증키 (Encoding/Decoding 둘 다 가능)">
  <button class="primary" id="load">전국 조회</button>
  <button id="downloadData">데이터 저장</button>
  <button id="loadDataBtn">데이터 불러오기</button>
  <button id="sampleDataBtn">샘플 데이터 로드</button>
  <input id="loadDataFile" type="file" accept=".json,application/json" style="display:none">
  <button id="test">API 키 테스트</button>

  if(j?.OpenAPI_ServiceResponse?.cmmMsgHeader){
    const h2=j.OpenAPI_ServiceResponse.cmmMsgHeader;
    throw new Error((h2.returnAuthMsg||h2.errMsg||"OpenAPI 오류"));
  }
  return j?.response?.body?.items||[];
}

function downloadCurrentData(){
  if(!data || !data.length){
    alertMsg("저장할 데이터가 없습니다. 먼저 전국 조회를 실행하거나 JSON 데이터를 불러오세요.");
    return;
  }

  const payload = {
    format: "airkorea-dust-map",
    version: 1,
    savedAt: new Date().toISOString(),
    source: dataSource,
    stationCount: data.length,
    fields: {
      pm10: "pm10Value",
      pm25: "pm25Value",
      latitude: "dmX",
      longitude: "dmY"
    },
    data: data.map(x => ({
      stationName: x.stationName ?? null,
      sidoName: x.sidoName ?? null,
      dataTime: x.dataTime ?? null,
      dmX: x.dmX ?? null,
      dmY: x.dmY ?? null,
      addr: x.addr ?? null,
      pm10Value: x.pm10Value ?? null,
      pm25Value: x.pm25Value ?? null,
      khaiValue: x.khaiValue ?? null,
      pm10Grade: x.pm10Grade ?? null,
      pm25Grade: x.pm25Grade ?? null,
      khaiGrade: x.khaiGrade ?? null
    }))
  };

  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const fileName =
    "airkorea_" +
    now.getFullYear() +
    pad(now.getMonth()+1) +
    pad(now.getDate()) + "_" +
    pad(now.getHours()) +
    pad(now.getMinutes()) + ".json";

  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alertMsg("PM10 / PM2.5 전국 데이터를 JSON으로 저장했습니다.",4000);
}


function applyLoadedJson(parsed, sourceName="JSON 파일"){
  let rows;

  if(parsed && parsed.format === "airkorea-dust-map" && Array.isArray(parsed.data)){
    rows = parsed.data;
    loadedAt = parsed.savedAt || null;
  }else if(Array.isArray(parsed)){
    rows = parsed;
    loadedAt = null;
  }else{
    throw new Error("지원하지 않는 JSON 형식입니다.");
  }

  const normalized = rows
    .filter(x => x && x.stationName)
    .map(x => ({
      stationName: x.stationName ?? null,
      sidoName: x.sidoName ?? null,
      dataTime: x.dataTime ?? null,
      dmX: x.dmX ?? null,
      dmY: x.dmY ?? null,
      addr: x.addr ?? null,
      pm10Value: x.pm10Value ?? "-",
      pm25Value: x.pm25Value ?? "-",
      khaiValue: x.khaiValue ?? "-",
      pm10Grade: x.pm10Grade ?? null,
      pm25Grade: x.pm25Grade ?? null,
      khaiGrade: x.khaiGrade ?? null
    }));

  if(!normalized.length){
    throw new Error("표시할 측정소 데이터가 없습니다.");
  }

  data = normalized;
  dataSource = sourceName === "샘플 데이터" ? "sample" : "file";

  removeHeatmap();
  render(true);
  updateSourceInfo();
  updateLegends();

  if($("showHeatmap") && $("showHeatmap").checked){
    buildHeatmap();
  }

  const pm10Count = data.filter(x=>valid(x.pm10Value)).length;
  const pm25Count = data.filter(x=>valid(x.pm25Value)).length;

  status(
    sourceName + " 로드 완료 · 측정소 " + data.length +
    "개 · PM10 " + pm10Count +
    "개 · PM2.5 " + pm25Count + "개"
  );
}

function grade(type,v){
  v=Number(v);
  if(!Number.isFinite(v))return ["정보없음","#9ca3af"];
  if(type==="pm25"){
    if(v<=15)return["좋음","#2563eb"];
    if(v<=35)return["보통","#16a34a"];
    if(v<=75)return["나쁨","#f97316"];
    return["매우 나쁨","#dc2626"];
  }
  if(v<=30)return["좋음","#2563eb"];
  if(v<=80)return["보통","#16a34a"];
  if(v<=150)return["나쁨","#f97316"];
  return["매우 나쁨","#dc2626"];
}
const valid=v=>v!==null&&v!==undefined&&v!==""&&v!=="-"&&Number.isFinite(Number(v));

function render(fitView=false){
  layers.forEach(x=>map.removeLayer(x)); layers=[];
  const type=$("pollutant").value, key=type==="pm25"?"pm25Value":"pm10Value";
  let values=0; const bounds=[];
  for(const x of data){
    // AirKorea: dmX = WGS84 위도(latitude), dmY = WGS84 경도(longitude)
    const lat=Number(x.dmX),lng=Number(x.dmY);
    if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
    const v=valid(x[key])?Number(x[key]):null;
    const minRaw = $("minValue").value.trim();
    const minValue = minRaw === "" ? null : Number(minRaw);

    if(minValue !== null && Number.isFinite(minValue)){
      if(v === null || v < minValue) continue;
    }

    if(v!==null)values++;
    const [g,c]=grade(type,v);

    // 등고선 모드에서는 숫자/점 마커를 숨긴다.
    if(!$("showValues").checked){
      bounds.push([lat,lng]);
      continue;
    }

    const m=L.circleMarker([lat,lng],{
      radius:12,color:"#fff",weight:2,fillColor:c,fillOpacity:.92
    }).addTo(map);
    m.bindTooltip(v===null?"-":String(v),{
      permanent:map.getZoom()>=7,direction:"center",className:"num-label"
    });
    m.bindPopup(`
      <b style="font-size:15px">${esc(x.stationName)}</b><br>
      ${esc(x.sidoName||"")}<hr style="border:0;border-top:1px solid #ddd">
      PM10 : <b>${esc(x.pm10Value??"-")}</b> ㎍/㎥<br>
      PM2.5 : <b>${esc(x.pm25Value??"-")}</b> ㎍/㎥<br>
      등급 : <b style="color:${c}">${g}</b><br>
      측정시각 : ${esc(x.dataTime||"-")}
    `);
    layers.push(m); bounds.push([lat,lng]);
  }
  if(!$("showValues").checked){
    $("cnt").textContent=bounds.length;
    $("vcnt").textContent=values;
  }else{
    $("cnt").textContent=layers.length;
    $("vcnt").textContent=values;
  }
  if(fitView && bounds.length) map.fitBounds(bounds,{padding:[20,20],maxZoom:8});
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

// -----------------------------------------------------------------------------
// 농도 분포도 (IDW 보간 기반 면 표시)
// - 점(측정소) 블러 누적 방식 대신, 전 지역을 역거리가중(IDW)으로 보간해 채색
// - 등급 경계는 grade()와 동일한 환경부 기준(pm25: 15/35/75, pm10: 30/80/150)
// -----------------------------------------------------------------------------
const IDW_BREAKS = { pm25:[15,35,75,150], pm10:[30,80,150,300] };
const IDW_BAND_COLORS = [
  [[38,86,220],[51,201,238]],   // 좋음  파랑 → 하늘
  [[70,200,90],[196,222,72]],   // 보통  초록 → 연두
  [[245,210,60],[236,120,40]],  // 나쁨  노랑 → 주황
  [[221,55,40],[112,13,12]]     // 매우나쁨 빨강 → 암적
];
function idwLerp(a,b,t){ return a+(b-a)*t; }
function idwColorOf(v, br){
  const edges=[0,br[0],br[1],br[2],br[3]];
  let band=3;
  for(let i=0;i<4;i++){ if(v<=edges[i+1]){ band=i; break; } }
  const lo=edges[band], hi=edges[band+1];
  const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const [c0,c1]=IDW_BAND_COLORS[band];
  return [idwLerp(c0[0],c1[0],t)|0, idwLerp(c0[1],c1[1],t)|0, idwLerp(c0[2],c1[2],t)|0];
}

// 시/도 경계(TopoJSON) 디코딩 — 육지 모양 클리핑 및 흰 경계선용
function idwDecodeArcs(topo){
  const t=topo.transform;
  return topo.arcs.map(arc=>{
    let x=0,y=0;
    return arc.map(p=>{
      x+=p[0]; y+=p[1];
      return t ? [x*t.scale[0]+t.translate[0], y*t.scale[1]+t.translate[1]] : [x,y];
    });
  });
}
function idwRingFromArcs(idx, arcs){
  const ring=[];
  for(const i of idx){
    let a = i>=0 ? arcs[i] : arcs[~i].slice().reverse();
    if(ring.length) a=a.slice(1);
    ring.push(...a);
  }
  return ring;
}
const PROV_RINGS = (function(){
  const topo=JSON.parse($("provTopo").textContent);
  const arcs=idwDecodeArcs(topo);
  const obj=topo.objects[Object.keys(topo.objects)[0]];
  const rings=[];
  for(const g of obj.geometries){
    const polys = g.type==="Polygon" ? [g.arcs] : g.arcs;
    for(const poly of polys) for(const r of poly){
      // TopoJSON 좌표는 [lon,lat] → Leaflet은 [lat,lon]
      rings.push(idwRingFromArcs(r,arcs).map(([lon,lat])=>[lat,lon]));
    }
  }
  return rings;
})();

const IdwLayer = L.Layer.extend({
  onAdd(map){
    this._map=map;
    this._canvas=L.DomUtil.create("canvas","idw-layer");
    this._canvas.style.pointerEvents="none";
    const sz=map.getSize();
    this._canvas.width=sz.x; this._canvas.height=sz.y;
    map.getPane("overlayPane").appendChild(this._canvas);
    map.on("moveend zoomend resize", this._reset, this);
    this._reset();
  },
  onRemove(map){
    map.getPane("overlayPane").removeChild(this._canvas);
    map.off("moveend zoomend resize", this._reset, this);
  },
  _reset(){
    const tl=this._map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._canvas, tl);
    const sz=this._map.getSize();
    this._canvas.width=sz.x; this._canvas.height=sz.y;
    this._draw();
  },
  redraw(){ if(this._map) this._draw(); },
  _draw(){
    const map=this._map, W=this._canvas.width, H=this._canvas.height;
    const ctx=this._canvas.getContext("2d");
    ctx.clearRect(0,0,W,H);
    if(!W||!H) return;

    const type=$("pollutant").value;
    const key=type==="pm25"?"pm25Value":"pm10Value";
    const br=IDW_BREAKS[type];
    const minRaw=$("minValue").value.trim();
    const minValue=minRaw===""?null:Number(minRaw);

    const pts=[];
    for(const x of data){
      const lat=Number(x.dmX), lng=Number(x.dmY);
      const v=valid(x[key])?Number(x[key]):null;
      if(!Number.isFinite(lat)||!Number.isFinite(lng)||v===null) continue;
      if(minValue!==null && Number.isFinite(minValue) && v<minValue) continue;
      const p=map.latLngToContainerPoint([lat,lng]);
      pts.push({x:p.x, y:p.y, v});
    }
    if(!pts.length) return;

    // 육지(시/도) 클리핑 경로 — 현재 화면 좌표 기준으로 매번 재투영
    const land=new Path2D();
    let hasLand=false;
    for(const ring of PROV_RINGS){
      let started=false;
      for(const [lat,lon] of ring){
        const p=map.latLngToContainerPoint([lat,lon]);
        if(p.x<-200||p.x>W+200||p.y<-200||p.y>H+200){ started=false; continue; }
        if(!started){ land.moveTo(p.x,p.y); started=true; hasLand=true; }
        else land.lineTo(p.x,p.y);
      }
      land.closePath();
    }
    if(!hasLand) return;

    const GRID=4;
    const gw=Math.ceil(W/GRID), gh=Math.ceil(H/GRID);
    const off=document.createElement("canvas");
    off.width=gw; off.height=gh;
    const offCtx=off.getContext("2d");
    const img=offCtx.createImageData(gw,gh);
    const d=img.data;
    const n=pts.length;
    const px=new Float64Array(n), py=new Float64Array(n), pv=new Float64Array(n);
    for(let i=0;i<n;i++){ px[i]=pts[i].x; py[i]=pts[i].y; pv[i]=pts[i].v; }

    for(let gy=0; gy<gh; gy++){
      const cy=gy*GRID+GRID/2;
      for(let gx=0; gx<gw; gx++){
        const cx=gx*GRID+GRID/2;
        let sw=0, sv=0;
        for(let i=0;i<n;i++){
          const dx=cx-px[i], dy=cy-py[i];
          const d2=dx*dx+dy*dy;
          if(d2<1){ sw=1; sv=pv[i]; break; }
          const w=1/(d2*Math.sqrt(d2)); // power 3
          sw+=w; sv+=w*pv[i];
        }
        const [r,g,b]=idwColorOf(sv/sw, br);
        const o=(gy*gw+gx)*4;
        d[o]=r; d[o+1]=g; d[o+2]=b; d[o+3]=255;
      }
    }
    offCtx.putImageData(img,0,0);

    ctx.save();
    ctx.clip(land);
    ctx.globalAlpha=0.72;
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
    ctx.drawImage(off,0,0,W,H);
    ctx.globalAlpha=1;
    ctx.restore();
    ctx.strokeStyle="rgba(255,255,255,.9)";
    ctx.lineWidth=1.4; ctx.lineJoin="round";
    ctx.stroke(land);
  }
});

let idwLayer = null;

function removeHeatmap(){
  if(idwLayer){
    map.removeLayer(idwLayer);
    idwLayer = null;
  }
}

function buildHeatmap(){
  if(!idwLayer){
    idwLayer = new IdwLayer();
    idwLayer.addTo(map);
  }else{
    idwLayer.redraw();
  }
}

function updateLayers(){
  if($("showHeatmap").checked){
    buildHeatmap();
  }else{
    removeHeatmap();
  }

  render(false);
  updateLegends();
}



function updateLegends(){
  const type = document.getElementById("pollutant").value;
  const showHeat = $("showHeatmap") && $("showHeatmap").checked;
  const showValues = $("showValues") && $("showValues").checked;
  const titleBase = type === "pm25" ? "PM2.5" : "PM10";
  const minRaw = $("minValue") ? $("minValue").value.trim() : "";
  const filterText = minRaw ? '<div style="margin-top:5px">표시 기준: <b>'+minRaw+' 이상</b></div>' : '';

  const valueBox = document.getElementById("valueLegendBox");
  const heatBox = document.getElementById("heatLegendBox");

  if(valueBox){
    valueBox.style.display = showValues ? "block" : "none";
    valueBox.innerHTML =
      '<b>'+titleBase+' 등급</b><br>'+
      '<span class="dot" style="background:#2563eb"></span>좋음<br>'+
      '<span class="dot" style="background:#16a34a"></span>보통<br>'+
      '<span class="dot" style="background:#f97316"></span>나쁨<br>'+
      '<span class="dot" style="background:#dc2626"></span>매우 나쁨'+
      filterText;
  }

  if(heatBox){
    heatBox.style.display = showHeat ? "block" : "none";

    const br = IDW_BREAKS[type];
    const ticks = type === "pm25"
      ? "0 · 15 · 35 · 75 · 150+"
      : "0 · 30 · 80 · 150 · 300+";
    const p1=(br[0]/br[3]*100).toFixed(0), p2=(br[1]/br[3]*100).toFixed(0), p3=(br[2]/br[3]*100).toFixed(0);

    heatBox.innerHTML =
      '<b>'+titleBase+' 분포도</b><br>'+
      '<div style="width:22px;height:135px;margin:7px auto 4px;'+
      'background:linear-gradient(to top,#2563eb 0%,#38c9ee '+p1+'%,#16a34a '+p1+'%,'+
      '#c4de48 '+p2+'%,#f5d23c '+p2+'%,#ec7828 '+p3+'%,#dd3728 '+p3+'%,#700d0c 100%);'+
      'border:1px solid rgba(0,0,0,.25)"></div>'+
      '<div style="font-size:10px;text-align:center;line-height:1.35">'+ticks+' ㎍/㎥</div>'+
      filterText;
  }
}


const topWrap = document.getElementById("topWrap");
const collapseBtn = document.getElementById("collapseBtn");
const mapOnlyBtn = document.getElementById("mapOnlyBtn");
const locateBtn = document.getElementById("locateBtn");

const restoreUiBtn = document.getElementById("restoreUiBtn");

restoreUiBtn.addEventListener("click", () => {
  document.body.classList.remove("map-only");
  mapOnlyBtn.classList.remove("active");
  mapOnlyBtn.textContent = "지도만 보기";
  setTimeout(() => map.invalidateSize(), 120);
});


collapseBtn.addEventListener("click", () => {
  const isCollapsed = topWrap.classList.toggle("collapsed");
  collapseBtn.textContent = isCollapsed ? "▼ 상단 펼치기" : "▲ 상단 접기";
  setTimeout(() => map.invalidateSize(), 120);
});

mapOnlyBtn.addEventListener("click", () => {
  const active = document.body.classList.toggle("map-only");
  mapOnlyBtn.classList.toggle("active", active);
  mapOnlyBtn.textContent = active ? "전체 화면 종료" : "지도만 보기";
  setTimeout(() => map.invalidateSize(), 120);
});

function moveToCurrentLocation(){
  if(!navigator.geolocation){
    alertMsg("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
    return;
  }

  status("현재 위치를 확인하는 중...");
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      if(window.__myLocationMarker){
        map.removeLayer(window.__myLocationMarker);
      }

      window.__myLocationMarker = L.circleMarker([lat,lng],{
        radius:10,
        color:"#111827",
        weight:3,
        fillColor:"#ffffff",
        fillOpacity:1
      }).addTo(map).bindPopup(
        "현재 위치<br>정확도 약 " + Math.round(acc) + "m"
      );

      map.setView([lat,lng], 14, {animate:true});
      window.__myLocationMarker.openPopup();
      status("현재 위치로 이동했습니다.");
    },
    err => {
      let msg = "현재 위치를 가져오지 못했습니다.";
      if(err.code===1) msg += " 위치 권한을 허용해주세요.";
      else if(err.code===2) msg += " 위치 정보를 확인할 수 없습니다.";
      else if(err.code===3) msg += " 위치 확인 시간이 초과되었습니다.";
      alertMsg(msg, 7000);
      status("현재 위치 조회 실패");
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }
  );
}

locateBtn.addEventListener("click", moveToCurrentLocation);

// 지도 위에도 현재위치 버튼 추가
const locateControl = L.control({position:"topleft"});
locateControl.onAdd = function(){
  const btn = L.DomUtil.create("button","locate-control");
  btn.type = "button";
  btn.title = "현재 위치";
  btn.innerHTML = "◎";
  L.DomEvent.disableClickPropagation(btn);
  L.DomEvent.on(btn,"click",moveToCurrentLocation);
  return btn;
};
locateControl.addTo(map);


const valueLegend = L.control({position:"bottomright"});
valueLegend.onAdd=()=>{
  const d=L.DomUtil.create("div","legend");
  d.id="valueLegendBox";
  return d;
};
valueLegend.addTo(map);

const heatLegend = L.control({position:"bottomleft"});
heatLegend.onAdd=()=>{
  const d=L.DomUtil.create("div","legend");
  d.id="heatLegendBox";
  return d;
};
heatLegend.addTo(map);

updateLegends();


window.addEventListener("load", () => {
  updateSourceInfo();
});
