<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222}

header{padding:12px 16px;border-bottom:1px solid #ddd;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  font-size:19px;font-weight:900;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.18)
}

@media(min-width:701px){
  .mobile-actions{padding:6px 16px}

#restoreUiBtn{
  position:fixed;
  top:12px;
  right:12px;
  z-index:10000;
  height:42px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:10px;

  color:#fff;

</head>
<body>
<button id="restoreUiBtn" type="button">UI 보기</button>
<div id="topWrap">
<div class="mobile-actions">
  <button id="collapseBtn">▲ 상단 접기</button>
  <button id="mapOnlyBtn" class="dark">지도만 보기</button>
  <button id="locateBtn">◎ 현재위치</button>
</div>
<header>
  <h1>전국 미세먼지 측정소 지도</h1>
  <select id="pollutant">
    <option value="pm10">PM10 미세먼지</option>
    <option value="pm25">PM2.5 초미세먼지</option>
  </select>
  <label style="display:flex;align-items:center;gap:5px;font-weight:700">
    <input id="showValues" type="checkbox" checked style="width:auto;height:auto">
    값 표시
  </label>
  <label style="display:flex;align-items:center;gap:5px;font-weight:700">
    <input id="showHeatmap" type="checkbox" style="width:auto;height:auto">
    Heatmap 표시
  </label>
  <input id="minValue" type="number" inputmode="numeric" min="0" step="1" placeholder="최소 수치 이상만 표시" style="width:170px">
  <input id="key" type="password" value="" placeholder="공공데이터포털 일반 인증키 (Encoding/Decoding 둘 다 가능)">
  <button class="primary" id="load">전국 조회</button>
  <button id="downloadData">데이터 저장</button>
  <button id="loadDataBtn">데이터 불러오기</button>
  <button id="sampleDataBtn">샘플 데이터 로드</button>
  <input id="loadDataFile" type="file" accept=".json,application/json" style="display:none">
  <button id="test">API 키 테스트</button>
</header>

<div id="status">
  <span>측정소 <b id="cnt">0</b>개</span>
  <span>측정값 <b id="vcnt">0</b>개</span>
  <span id="state">인증키를 입력한 뒤 API 키 테스트를 먼저 눌러보세요.</span><span id="sourceInfo"></span>
</div>
</div>
<div id="msg" class="msg"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script>
const AIR_URL = "https://apis.data.go.kr/B552584/ArpltnInforInqireSvc/getCtprvnRltmMesureDnsty";
const ST_URL  = "https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc/getMsrstnList";
const SAMPLE_DATA_URL = "https://raw.githubusercontent.com/kei-soft/File/master/airkorea_20260902_2057.json";

const SIDOS=["서울","부산","대구","인천","광주","대전","울산","경기","강원","충북","충남","전북","전남","경북","경남","제주","세종"];

const map=L.map("map",{preferCanvas:true}).setView([36.3,127.8],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19, attribution:"© OpenStreetMap"
}).addTo(map);

let layers=[], data=[];
let dataSource = "api";
let loadedAt = null;
const $=id=>document.getElementById(id);

function alertMsg(t, ms=8000){
  $("msg").textContent=t; $("msg").style.display="block";
  clearTimeout(alertMsg.t);
  alertMsg.t=setTimeout(()=>$("msg").style.display="none",ms);
}
function status(t){$("state").textContent=t}

// 중요:
// Encoding 키는 이미 %2B, %2F, %3D 형태이므로 다시 encodeURIComponent 하면 안 됩니다.
// Decoding 키는 + / = 등을 포함하므로 encodeURIComponent 해야 합니다.
function normalizeServiceKey(k){
  k=k.trim();
  const looksEncoded=/%[0-9A-Fa-f]{2}/.test(k);
  return looksEncoded ? k : encodeURIComponent(k);
}

function makeUrl(base, params){
  const key=normalizeServiceKey($("key").value);
  const rest=Object.entries(params)
    .map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v))
    .join("&");
  // serviceKey만 별도로 붙여 이중 인코딩 방지
  return base+"?serviceKey="+key+"&"+rest;
}

async function getJson(base,params){
  const url=makeUrl(base,params);
  let res;
  try{
    res=await fetch(url,{method:"GET",mode:"cors",cache:"no-store"});
  }catch(e){
    throw new Error("브라우저 CORS/네트워크 오류: "+e.message);
  }
  const text=await res.text();
  if(!res.ok){
    throw new Error("HTTP "+res.status+" / "+text.slice(0,180));
  }
  let j;
  try{j=JSON.parse(text)}
  catch{
    throw new Error("JSON 응답이 아닙니다: "+text.slice(0,180));
  }
  const h=j?.response?.header;
  if(h && String(h.resultCode)!=="00"){
    throw new Error((h.resultCode||"API")+" / "+(h.resultMsg||"API 오류"));
  }
  if(j?.OpenAPI_ServiceResponse?.cmmMsgHeader){
    const h2=j.OpenAPI_ServiceResponse.cmmMsgHeader;
    throw new Error((h2.returnAuthMsg||h2.errMsg||"OpenAPI 오류"));
  }
  return j?.response?.body?.items||[];
}


function updateSourceInfo(){
  const el = $("sourceInfo");
  if(!el) return;

  if(dataSource === "sample"){
    el.textContent = "데이터 소스: GitHub 샘플";
  }else if(dataSource === "file"){
    el.textContent = "데이터 소스: JSON 파일";
  }else if(data.length){
    el.textContent = "데이터 소스: AirKorea API";
  }else{
    el.textContent = "";
  }
}

function downloadCurrentData(){
  if(!data || !data.length){
    alertMsg("저장할 데이터가 없습니다. 먼저 전국 조회를 실행하거나 JSON 데이터를 불러오세요.");
    return;
  }

  const payload = {
    format: "airkorea-dust-map",
    version: 1,
    savedAt: new Date().toISOString(),
    source: dataSource,
    stationCount: data.length,
    fields: {
      pm10: "pm10Value",
      pm25: "pm25Value",
      latitude: "dmX",
      longitude: "dmY"
    },
    data: data.map(x => ({
      stationName: x.stationName ?? null,
      sidoName: x.sidoName ?? null,
      dataTime: x.dataTime ?? null,
      dmX: x.dmX ?? null,
      dmY: x.dmY ?? null,
      addr: x.addr ?? null,
      pm10Value: x.pm10Value ?? null,
      pm25Value: x.pm25Value ?? null,
      khaiValue: x.khaiValue ?? null,
      pm10Grade: x.pm10Grade ?? null,
      pm25Grade: x.pm25Grade ?? null,
      khaiGrade: x.khaiGrade ?? null
    }))
  };

  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const fileName =
    "airkorea_" +
    now.getFullYear() +
    pad(now.getMonth()+1) +
    pad(now.getDate()) + "_" +
    pad(now.getHours()) +
    pad(now.getMinutes()) + ".json";

  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alertMsg("PM10 / PM2.5 전국 데이터를 JSON으로 저장했습니다.",4000);
}


function applyLoadedJson(parsed, sourceName="JSON 파일"){
  let rows;

  if(parsed && parsed.format === "airkorea-dust-map" && Array.isArray(parsed.data)){
    rows = parsed.data;
    loadedAt = parsed.savedAt || null;
  }else if(Array.isArray(parsed)){
    rows = parsed;
    loadedAt = null;
  }else{
    throw new Error("지원하지 않는 JSON 형식입니다.");
  }

  const normalized = rows
    .filter(x => x && x.stationName)
    .map(x => ({
      stationName: x.stationName ?? null,
      sidoName: x.sidoName ?? null,
      dataTime: x.dataTime ?? null,
      dmX: x.dmX ?? null,
      dmY: x.dmY ?? null,
      addr: x.addr ?? null,
      pm10Value: x.pm10Value ?? "-",
      pm25Value: x.pm25Value ?? "-",
      khaiValue: x.khaiValue ?? "-",
      pm10Grade: x.pm10Grade ?? null,
      pm25Grade: x.pm25Grade ?? null,
      khaiGrade: x.khaiGrade ?? null
    }));

  if(!normalized.length){
    throw new Error("표시할 측정소 데이터가 없습니다.");
  }

  data = normalized;
  dataSource = sourceName === "샘플 데이터" ? "sample" : "file";

  removeHeatmap();
  render(true);
  updateSourceInfo();
  updateLegends();

  if($("showHeatmap") && $("showHeatmap").checked){
    buildHeatmap();
  }

  const pm10Count = data.filter(x=>valid(x.pm10Value)).length;
  const pm25Count = data.filter(x=>valid(x.pm25Value)).length;

  status(
    sourceName + " 로드 완료 · 측정소 " + data.length +
    "개 · PM10 " + pm10Count +
    "개 · PM2.5 " + pm25Count + "개"
  );
}

async function loadSampleData(){
  const btn = $("sampleDataBtn");
  const oldText = btn.textContent;

  try{
    btn.disabled = true;
    btn.textContent = "샘플 로드 중...";
    status("GitHub 샘플 데이터를 불러오는 중...");

    const res = await fetch(SAMPLE_DATA_URL, {
      method: "GET",
      cache: "no-store"
    });

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    const parsed = await res.json();
    applyLoadedJson(parsed, "샘플 데이터");

    alertMsg(
      "GitHub 샘플 데이터를 불러왔습니다. API 호출 없이 PM10/PM2.5를 표시합니다.",
      5000
    );
  }catch(err){
    console.error(err);
    status("샘플 데이터 로드 실패");
    alertMsg("샘플 데이터를 불러오지 못했습니다: " + err.message, 9000);
  }finally{
    btn.disabled = false;
    btn.textContent = oldText;
  }
}


async function loadDataFromFile(file){
  if(!file) return;

  try{
    const raw = await file.text();
    const parsed = JSON.parse(raw);

    applyLoadedJson(parsed, "JSON 파일");
    alertMsg("저장된 전국 데이터를 불러왔습니다. API 호출 없이 표시합니다.",5000);

  }catch(err){
    console.error(err);
    alertMsg("데이터 파일을 불러오지 못했습니다: " + err.message,9000);
    status("JSON 데이터 로드 실패");
  }finally{
    $("loadDataFile").value = "";
  }
}

$("downloadData").addEventListener("click", downloadCurrentData);

$("sampleDataBtn").addEventListener("click", loadSampleData);

$("loadDataBtn").addEventListener("click", ()=>{
  $("loadDataFile").click();
});

$("loadDataFile").addEventListener("change", e=>{
  const file = e.target.files && e.target.files[0];
  if(file) loadDataFromFile(file);
});


async function testKey(){
  if(!$("key").value.trim()){alertMsg("인증키를 입력해주세요.");return}
  status("대기오염정보 API를 테스트하는 중...");
  try{
    const items=await getJson(AIR_URL,{
      returnType:"json",numOfRows:"10",pageNo:"1",sidoName:"서울",ver:"1.3"
    });
    status("대기오염정보 API 정상 · 서울 데이터 "+items.length+"건");
    alertMsg("성공: 현재 인증키로 '대기오염정보 API' 호출이 정상입니다.",5000);
  }catch(e){
    status("대기오염정보 API 실패");
    alertMsg("실패: "+e.message,12000);
    console.error(e);
  }
}

function grade(type,v){
  v=Number(v);
  if(!Number.isFinite(v))return ["정보없음","#9ca3af"];
  if(type==="pm25"){
    if(v<=15)return["좋음","#2563eb"];
    if(v<=35)return["보통","#16a34a"];
    if(v<=75)return["나쁨","#f97316"];
    return["매우 나쁨","#dc2626"];
  }
  if(v<=30)return["좋음","#2563eb"];
  if(v<=80)return["보통","#16a34a"];
  if(v<=150)return["나쁨","#f97316"];
  return["매우 나쁨","#dc2626"];
}
const valid=v=>v!==null&&v!==undefined&&v!==""&&v!=="-"&&Number.isFinite(Number(v));

function render(fitView=false){
  layers.forEach(x=>map.removeLayer(x)); layers=[];
  const type=$("pollutant").value, key=type==="pm25"?"pm25Value":"pm10Value";
  let values=0; const bounds=[];
  for(const x of data){
    // AirKorea: dmX = WGS84 위도(latitude), dmY = WGS84 경도(longitude)
    const lat=Number(x.dmX),lng=Number(x.dmY);
    if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
    const v=valid(x[key])?Number(x[key]):null;
    const minRaw = $("minValue").value.trim();
    const minValue = minRaw === "" ? null : Number(minRaw);

    if(minValue !== null && Number.isFinite(minValue)){
      if(v === null || v < minValue) continue;
    }

    if(v!==null)values++;
    const [g,c]=grade(type,v);

    // 등고선 모드에서는 숫자/점 마커를 숨긴다.
    if(!$("showValues").checked){
      bounds.push([lat,lng]);
      continue;
    }

    const m=L.circleMarker([lat,lng],{
      radius:12,color:"#fff",weight:2,fillColor:c,fillOpacity:.92
    }).addTo(map);
    m.bindTooltip(v===null?"-":String(v),{
      permanent:map.getZoom()>=7,direction:"center",className:"num-label"
    });
    m.bindPopup(`
      <b style="font-size:15px">${esc(x.stationName)}</b><br>
      ${esc(x.sidoName||"")}<hr style="border:0;border-top:1px solid #ddd">
      PM10 : <b>${esc(x.pm10Value??"-")}</b> ㎍/㎥<br>
      PM2.5 : <b>${esc(x.pm25Value??"-")}</b> ㎍/㎥<br>
      등급 : <b style="color:${c}">${g}</b><br>
      측정시각 : ${esc(x.dataTime||"-")}
    `);
    layers.push(m); bounds.push([lat,lng]);
  }
  if(!$("showValues").checked){
    $("cnt").textContent=bounds.length;
    $("vcnt").textContent=values;
  }else{
    $("cnt").textContent=layers.length;
    $("vcnt").textContent=values;
  }
  if(fitView && bounds.length) map.fitBounds(bounds,{padding:[20,20],maxZoom:8});
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

async function loadAll(){
  if(!$("key").value.trim()){alertMsg("인증키를 입력해주세요.");return}
  $("load").disabled=true; data=[]; render(false);

  try{
    // 1. 우선 사용자가 신청한 대기오염정보 API가 되는지 먼저 확인
    status("1/3 · 대기오염정보 API 인증 확인...");
    await getJson(AIR_URL,{
      returnType:"json",numOfRows:"1",pageNo:"1",sidoName:"서울",ver:"1.3"
    });

    // 2. 측정소 좌표 API 권한 확인
    status("2/3 · 측정소 위치 API 인증 확인...");
    try{
      await getJson(ST_URL,{
        returnType:"json",numOfRows:"1",pageNo:"1",addr:"서울"
      });
    }catch(e){
      throw new Error(
        "대기오염정보 API는 정상입니다. 하지만 '측정소 정보 조회 서비스(MsrstnInfoInqireSvc)'가 실패했습니다. "+
        "전국 측정소를 지도에 찍으려면 측정소 위도/경도가 필요하므로 해당 OpenAPI도 활용신청해야 합니다. 상세 오류: "+e.message
      );
    }

    // 3. 전국 수집
    const merged=[];
    for(let i=0;i<SIDOS.length;i++){
      const sido=SIDOS[i];
      status(`3/3 · 전국 조회 ${i+1}/${SIDOS.length} · ${sido}`);

      const [air,stations]=await Promise.all([
        getJson(AIR_URL,{
          returnType:"json",numOfRows:"1000",pageNo:"1",sidoName:sido,ver:"1.3"
        }),
        getJson(ST_URL,{
          returnType:"json",numOfRows:"1000",pageNo:"1",addr:sido
        })
      ]);

      const pos=new Map();
      stations.forEach(s=>{
        if(s.stationName)pos.set(String(s.stationName).trim(),s);
      });
      air.forEach(a=>{
        const p=pos.get(String(a.stationName||"").trim());
        if(p && valid(p.dmX) && valid(p.dmY)){
          merged.push({...a,sidoName:sido,dmX:p.dmX,dmY:p.dmY});
        }
      });
    }
    data=merged;
    dataSource="api";
    loadedAt=new Date().toISOString();
    render(true);
    updateSourceInfo();
    status("완료 · 지도 표시 "+merged.length+"개 측정소");
    alertMsg("전국 데이터를 정상적으로 불러왔습니다. PM10/PM2.5가 함께 저장되어 있습니다.",4000);
  }catch(e){
    console.error(e);
    status("조회 실패");
    alertMsg(e.message,15000);
  }finally{
    $("load").disabled=false;
  }
}

$("test").onclick=testKey;
$("load").onclick=loadAll;
$("pollutant").onchange=()=>{
  render(false);
  updateLegends();
  if($("showHeatmap").checked) buildHeatmap();
};
$("minValue").addEventListener("input", ()=>{
  render(false);
  updateLegends();
  if($("showHeatmap").checked) buildHeatmap();
});
$("showValues").addEventListener("change", updateLayers);
$("showHeatmap").addEventListener("change", updateLayers);
map.on("zoomend",()=>{
  const show=map.getZoom()>=7;
  layers.forEach(m=>{
    const tt=m.getTooltip();
    if(tt && tt.options.permanent!==show){
      const content=tt.getContent();
      m.unbindTooltip();
      m.bindTooltip(content,{
        permanent:show,direction:"center",className:"num-label"
      });
    }
  });
});



// -----------------------------------------------------------------------------
// Leaflet Heatmap - v17 방식
// - PM10 / PM2.5 절대 수치 기준
// - 상대 p95 정규화 사용 안 함
// -----------------------------------------------------------------------------
let heatLayer = null;

function removeHeatmap(){
  if(heatLayer){
    map.removeLayer(heatLayer);
    heatLayer = null;
  }
}

function buildHeatmap(){
  removeHeatmap();

  const type = $("pollutant").value;
  const valueKey = type === "pm25" ? "pm25Value" : "pm10Value";
  const minRaw = $("minValue").value.trim();
  const minValue = minRaw === "" ? null : Number(minRaw);

  const raw = [];

  for(const x of data){
    const lat = Number(x.dmX);
    const lng = Number(x.dmY);
    const v = valid(x[valueKey]) ? Number(x[valueKey]) : null;

    if(!Number.isFinite(lat) || !Number.isFinite(lng) || v === null) continue;
    if(minValue !== null && Number.isFinite(minValue) && v < minValue) continue;

    raw.push([lat,lng,v]);
  }

  if(!raw.length) return;

  // v17: 실제 수치 기준으로 고정
  const absoluteMax = type === "pm25" ? 100 : 200;

  const heatData = raw.map(([lat,lng,v]) => {
    const intensity = Math.max(0, Math.min(1, v / absoluteMax));
    return [lat,lng,intensity];
  });

  const z = map.getZoom();

  // v17 원래 반경/blur
  const radius =
    z <= 7 ? 17 :
    z <= 9 ? 21 :
    z <= 11 ? 25 : 29;

  const blur =
    z <= 8 ? 20 :
    z <= 10 ? 23 : 26;

  let gradient;

  if(type === "pm25"){
    gradient = {
      0.00:"#2563eb",
      0.15:"#2563eb",
      0.35:"#16a34a",
      0.75:"#f97316",
      1.00:"#dc2626"
    };
  }else{
    gradient = {
      0.00:"#2563eb",
      0.15:"#2563eb",
      0.40:"#16a34a",
      0.75:"#f97316",
      1.00:"#dc2626"
    };
  }

  heatLayer = L.heatLayer(heatData,{
    radius,
    blur,
    minOpacity:0.20,
    maxZoom:14,
    max:1.0,
    gradient
  }).addTo(map);
}

function updateLayers(){
  if($("showHeatmap").checked){
    buildHeatmap();
  }else{
    removeHeatmap();
  }

  render(false);
  updateLegends();
}



function updateLegends(){
  const type = document.getElementById("pollutant").value;
  const showHeat = $("showHeatmap") && $("showHeatmap").checked;
  const showValues = $("showValues") && $("showValues").checked;
  const titleBase = type === "pm25" ? "PM2.5" : "PM10";
  const minRaw = $("minValue") ? $("minValue").value.trim() : "";
  const filterText = minRaw ? '<div style="margin-top:5px">표시 기준: <b>'+minRaw+' 이상</b></div>' : '';

  const valueBox = document.getElementById("valueLegendBox");
  const heatBox = document.getElementById("heatLegendBox");

  if(valueBox){
    valueBox.style.display = showValues ? "block" : "none";
    valueBox.innerHTML =
      '<b>'+titleBase+' 등급</b><br>'+
      '<span class="dot" style="background:#2563eb"></span>좋음<br>'+
      '<span class="dot" style="background:#16a34a"></span>보통<br>'+
      '<span class="dot" style="background:#f97316"></span>나쁨<br>'+
      '<span class="dot" style="background:#dc2626"></span>매우 나쁨'+
      filterText;
  }

  if(heatBox){
    heatBox.style.display = showHeat ? "block" : "none";

    const ticks = type === "pm25"
      ? "0 · 15 · 35 · 75 · 100+"
      : "0 · 30 · 80 · 150 · 200+";

    heatBox.innerHTML =
      '<b>'+titleBase+' Heatmap</b><br>'+
      '<div style="width:22px;height:135px;margin:7px auto 4px;'+
      'background:linear-gradient(to top,#2563eb 0%,#2563eb 15%,#16a34a 40%,#f97316 75%,#dc2626 100%);'+
      'border:1px solid rgba(0,0,0,.25)"></div>'+
      '<div style="font-size:10px;text-align:center;line-height:1.35">'+ticks+' ㎍/㎥</div>'+
      filterText;
  }
}


const topWrap = document.getElementById("topWrap");
const collapseBtn = document.getElementById("collapseBtn");
const mapOnlyBtn = document.getElementById("mapOnlyBtn");
const locateBtn = document.getElementById("locateBtn");

const restoreUiBtn = document.getElementById("restoreUiBtn");

restoreUiBtn.addEventListener("click", () => {
  document.body.classList.remove("map-only");
  mapOnlyBtn.classList.remove("active");
  mapOnlyBtn.textContent = "지도만 보기";
  setTimeout(() => map.invalidateSize(), 120);
});


collapseBtn.addEventListener("click", () => {
  const isCollapsed = topWrap.classList.toggle("collapsed");
  collapseBtn.textContent = isCollapsed ? "▼ 상단 펼치기" : "▲ 상단 접기";
  setTimeout(() => map.invalidateSize(), 120);
});

mapOnlyBtn.addEventListener("click", () => {
  const active = document.body.classList.toggle("map-only");
  mapOnlyBtn.classList.toggle("active", active);
  mapOnlyBtn.textContent = active ? "전체 화면 종료" : "지도만 보기";
  setTimeout(() => map.invalidateSize(), 120);
});

function moveToCurrentLocation(){
  if(!navigator.geolocation){
    alertMsg("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
    return;
  }

  status("현재 위치를 확인하는 중...");
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      if(window.__myLocationMarker){
        map.removeLayer(window.__myLocationMarker);
      }

      window.__myLocationMarker = L.circleMarker([lat,lng],{
        radius:10,
        color:"#111827",
        weight:3,
        fillColor:"#ffffff",
        fillOpacity:1
      }).addTo(map).bindPopup(
        "현재 위치<br>정확도 약 " + Math.round(acc) + "m"
      );

      map.setView([lat,lng], 14, {animate:true});
      window.__myLocationMarker.openPopup();
      status("현재 위치로 이동했습니다.");
    },
    err => {
      let msg = "현재 위치를 가져오지 못했습니다.";
      if(err.code===1) msg += " 위치 권한을 허용해주세요.";
      else if(err.code===2) msg += " 위치 정보를 확인할 수 없습니다.";
      else if(err.code===3) msg += " 위치 확인 시간이 초과되었습니다.";
      alertMsg(msg, 7000);
      status("현재 위치 조회 실패");
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }
  );
}

locateBtn.addEventListener("click", moveToCurrentLocation);

// 지도 위에도 현재위치 버튼 추가
const locateControl = L.control({position:"topleft"});
locateControl.onAdd = function(){
  const btn = L.DomUtil.create("button","locate-control");
  btn.type = "button";
  btn.title = "현재 위치";
  btn.innerHTML = "◎";
  L.DomEvent.disableClickPropagation(btn);
  L.DomEvent.on(btn,"click",moveToCurrentLocation);
  return btn;
};
locateControl.addTo(map);


const valueLegend = L.control({position:"bottomright"});
valueLegend.onAdd=()=>{
  const d=L.DomUtil.create("div","legend");
  d.id="valueLegendBox";
  return d;
};
valueLegend.addTo(map);

const heatLegend = L.control({position:"bottomleft"});
heatLegend.onAdd=()=>{
  const d=L.DomUtil.create("div","legend");
  d.id="heatLegendBox";
  return d;
};
heatLegend.addTo(map);

updateLegends();


window.addEventListener("load", () => {
  updateSourceInfo();
});
