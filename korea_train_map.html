  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: #1a1a2e; color: #eee; height: 100vh; overflow: hidden;
    }
    #map { width: 100%; height: 100%; z-index: 1; }
    
    .control-panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(20, 20, 40, 0.93); backdrop-filter: blur(10px);
      border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 360px; border: 1px solid rgba(255,255,255,0.1);
    }
    .control-panel h1 {
      font-size: 16px; margin-bottom: 8px; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .status { font-size: 12px; color: #aaa; margin-bottom: 12px; line-height: 1.4; }
    .status.ok { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.loading { color: #fbbf24; }
    
    .api-section { margin-bottom: 12px; }
    .api-section label { display: block; font-size: 12px; color: #bbb; margin-bottom: 4px; }
    .api-section input {
      width: 100%; padding: 8px 10px; border: 1px solid #444; border-radius: 6px;
      background: #0f0f1a; color: #fff; font-size: 13px;
    }
    .api-section input:focus { outline: none; border-color: #3b82f6; }
    
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    button {
      flex: 1; padding: 8px 12px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #374151; color: #e5e7eb; }
    .btn-secondary:hover { background: #4b5563; }
    
    .line-select { margin-top: 12px; }
    .line-select label { font-size: 12px; color: #bbb; display: block; margin-bottom: 6px; }
    .line-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 4px 10px; border-radius: 20px; font-size: 12px; cursor: pointer;
      border: 1px solid #444; background: #1f2937; color: #ccc; transition: all 0.15s; user-select: none;
    }
    .chip.active { background: #3b82f6; border-color: #3b82f6; color: white; }
    .chip:hover { border-color: #6b7280; }
    
    .legend {
      position: absolute; bottom: 20px; right: 12px; z-index: 1000;
      background: rgba(20, 20, 40, 0.9); padding: 12px 16px; border-radius: 10px;
      font-size: 12px; border: 1px solid rgba(255,255,255,0.1);
    }
    .legend-title { font-weight: 600; margin-bottom: 6px; color: #fff; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 3px 0; color: #ccc; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    
    .info-box {
      position: absolute; bottom: 20px; left: 12px; z-index: 1000;
      background: rgba(20, 20, 40, 0.92); padding: 14px 16px; border-radius: 10px;
      font-size: 12px; max-width: 300px; line-height: 1.5;
      border: 1px solid rgba(255,255,255,0.1); color: #bbb;
    }
    .info-box strong { color: #fff; }
    
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.45; }
    
    @media (max-width: 600px) {
      .control-panel { max-width: calc(100% - 24px); }
      .info-box { display: none; }
    }
  </style>
</head>

    const LINES = [
      { name: '1호선', color: '#0052A4' },
      { name: '2호선', color: '#00A84D' },
      { name: '3호선', color: '#EF7C1C' },
      { name: '4호선', color: '#00A5E5' },
      { name: '5호선', color: '#996CAC' },
      { name: '6호선', color: '#CD7C2F' },
      { name: '7호선', color: '#747F00' },
      { name: '8호선', color: '#E6186C' },
      { name: '9호선', color: '#BDB092' }
    ];
    
    let selectedLines = new Set(['2호선']);
    let updateInterval = null;
    let trainLayer = null;
    let map = null;
    
    function initMap() {
      map = L.map('map', { center: [37.55, 126.98], zoom: 11 });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap'
      }).addTo(map);
      trainLayer = L.layerGroup().addTo(map);
      
      const chipsContainer = document.getElementById('lineChips');
      LINES.forEach(line => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (selectedLines.has(line.name) ? ' active' : '');
        chip.textContent = line.name;
        chip.style.borderColor = line.color;
        chip.onclick = () => {
          if (selectedLines.has(line.name)) {
            selectedLines.delete(line.name);
            chip.classList.remove('active');
          } else {
            selectedLines.add(line.name);
            chip.classList.add('active');
          }
        };
        chipsContainer.appendChild(chip);
      });
    }
    
    async function fetchLinePositions(apiKey, lineName) {
      const url = `http://swopenAPI.seoul.go.kr/api/subway/${apiKey}/json/realtimePosition/0/200/${encodeURIComponent(lineName)}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.errorMessage && data.errorMessage.code !== 'INFO-000') {
          throw new Error(data.errorMessage.message || 'API 오류');
        }
        return data.realtimePositionList || [];
      } catch (err) {
        console.warn(lineName + ' 조회 실패:', err.message);
        return [];
      }
    }
    
    function getStationCoords(stationName) {
      if (!stationName) return null;
      const clean = stationName.replace(/\(.*?\)/g, '').trim();
      return STATION_COORDS[clean] || STATION_COORDS[stationName] || null;
    }
    
    async function updateTrains() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) {
        setStatus('API 키를 입력해주세요', 'error');
        return;
      }
      
      setStatus('데이터 불러오는 중...', 'loading');
      trainLayer.clearLayers();
      
      let totalTrains = 0;
      
      const promises = Array.from(selectedLines).map(async (lineName) => {
        const trains = await fetchLinePositions(apiKey, lineName);
        const lineInfo = LINES.find(l => l.name === lineName);
        
        trains.forEach(train => {
          const stationName = train.statnNm || '';
          const trainNo = train.trainNo || '?';
          const updn = train.updnLine === '0' ? '상행' : (train.updnLine === '1' ? '하행' : '');
          const statusCode = train.trainSttus;
          const statusText = statusCode === '0' ? '진입' : (statusCode === '1' ? '도착' : (statusCode === '2' ? '출발' : statusCode));
          const dest = train.statnTnm || '';
          
          const coords = getStationCoords(stationName);
          if (!coords) return;
          
          const lat = coords[0] + (Math.random() - 0.5) * 0.0015;
          const lng = coords[1] + (Math.random() - 0.5) * 0.0015;
          
          const marker = L.circleMarker([lat, lng], {
            radius: 8,
            fillColor: lineInfo ? lineInfo.color : '#666',
            color: '#fff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          });
          
          marker.bindPopup(`
            <div>
              <strong style="color:${lineInfo ? lineInfo.color : '#333'}">${lineName} ${trainNo}호</strong><br>
              현재 역: <b>${stationName}</b><br>
              ${updn ? updn + ' · ' : ''}${statusText}<br>
              ${dest ? '행선: ' + dest : ''}
            </div>
          `);
          
          marker.addTo(trainLayer);
          totalTrains++;
        });
      });
      
      await Promise.all(promises);
      
      if (totalTrains > 0) {
        setStatus(`정상 · ${totalTrains}개 열차 표시 · ${new Date().toLocaleTimeString('ko-KR')}`, 'ok');
      } else {
        setStatus('열차 데이터를 가져오지 못했습니다. 호선 선택과 네트워크를 확인하세요.', 'error');
      }
    }
    
    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || '');
    }
    
    function startTracking() {
      stopTracking();
      updateTrains();
      updateInterval = setInterval(updateTrains, 20000);
    }
    
    function stopTracking() {
      if (updateInterval) {
        clearInterval(updateInterval);
        updateInterval = null;
      }
      setStatus('중지됨', '');
    }
    
    document.addEventListener('DOMContentLoaded', initMap);
  </script>
